<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اتجاهات التصميم</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; background: #eceef2; color: #16181d; font: 16px/1.6 system-ui, "Noto Sans Arabic", sans-serif; }
  main { max-width: 1320px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .lead { margin: 0 0 28px; color: #4a5263; }
  figure { margin: 0 0 40px; background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 12px 30px -18px rgba(10, 20, 50, .45); }
  figure img { display: block; width: 100%; height: auto; }
  figcaption { padding: 16px 20px 20px; }
  figcaption b { font-size: 20px; }
  figcaption span { display: inline-block; font-size: 13px; background: #16181d; color: #fff; border-radius: 99px; padding: 1px 10px; margin-inline-start: 8px; vertical-align: 3px; }
  figcaption p { margin: 6px 0 0; color: #4a5263; }
</style>
</head>
<body>
<main>
  <h1>أربع اتجاهات لنفس الصفحة</h1>
  <p class="lead">كل صورة هي أول شاشة من نفس الصفحة، مبنية ببيانات 962Games الحقيقية. الفكرة وحدة بكل الخيارات: عنوان وأرقام، تابات، فلاتر، وشبكة الشركات.</p>

  <figure>
    <img src="assigned.png" alt="Amman Hillside">
    <figcaption><b>1 · Amman Hillside</b><span>طلع بالقرعة</span>
      <p>سماء زرقا، وكل استوديو بيت حجر على جبل عمّان مرتّب حسب سنة تأسيسه (2003 لـ 2024) واللوغو على يافطة فوق السطح. التابات يافطات شوارع زرقا، والعنصر المختار أصفر زي التكسي.</p></figcaption>
  </figure>

  <figure>
    <img src="model-pick.png" alt="Character Select">
    <figcaption><b>2 · Character Select</b><span>ترشيحي</span>
      <p>زي شاشة اختيار اللاعب بألعاب الأركيد: شبكة لوغوهات، وجنبها معاينة كبيرة للشركة المختارة مع زر زيارة الموقع.</p></figcaption>
  </figure>

  <figure>
    <img src="design-canon-creator-hardware-bench.png" alt="Desk Instrument">
    <figcaption><b>3 · Desk Instrument</b>
      <p>كونسول أجهزة: كل شركة زر مفتاح، وشاشة كهرمانية فيها العدد، ودولاب بتلفّه بين سنين التأسيس.</p></figcaption>
  </figure>

  <figure>
    <img src="canon.png" alt="Reference">
    <figcaption><b>4 · نفس شكل الأصلية</b>
      <p>تصميم gamecompanies.com زي ما هو (بنفسجي غامق مع مكعبات وورقة بيضاء) للأردن، مع خط زمني لسنين التأسيس.</p></figcaption>
  </figure>
</main>
</body>
</html>
